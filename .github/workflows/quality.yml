name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend and database checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: make backend-install

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Validate Docker Compose
        run: make compose-check

      - name: Run backend unit quality checks
        run: make backend-check

      - name: Validate evaluation cases
        run: make eval-validate

      - name: Start PostgreSQL service
        run: make db-up

      - name: Smoke test PostgreSQL
        run: make db-smoke

      - name: Run backend integration tests
        run: make backend-integration-test

      - name: Run deterministic evaluation suite
        run: make eval-run

      - name: Build and start the full stack
        run: make stack-reset

      - name: Run deterministic full-stack smoke test
        run: make stack-smoke

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps postgres backend frontend

      - name: Stop PostgreSQL service
        if: always()
        run: docker compose down --volumes --remove-orphans
