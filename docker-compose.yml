services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-text_to_sql}
      POSTGRES_USER: ${POSTGRES_USER:-text_to_sql_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-text_to_sql_local_password}
      APP_DB_READONLY_USER: ${APP_DB_READONLY_USER:-text_to_sql_reader}
      APP_DB_READONLY_PASSWORD: ${APP_DB_READONLY_PASSWORD:-text_to_sql_reader_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
